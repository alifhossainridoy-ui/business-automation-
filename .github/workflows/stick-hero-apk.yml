name: Build Stick Hero Run APK

on:
  push:
    paths:
      - 'stick-hero-run/**'
      - '.github/workflows/stick-hero-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy game into app assets
        run: |
          mkdir -p stick-hero-run/android/app/src/main/assets/www
          cp stick-hero-run/www/index.html stick-hero-run/android/app/src/main/assets/www/

      - name: Build APK
        working-directory: stick-hero-run/android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp stick-hero-run/android/app/build/outputs/apk/debug/app-debug.apk StickHeroRun.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StickHeroRun-apk
          path: StickHeroRun.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stick-hero-run-${{ github.run_number }}
          name: Stick Hero Run build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: StickHeroRun.apk
